<style>

html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}

nav{display:flex;gap:20px;align-items:center;font-weight:600;font-size:15px}
nav a:hover{color:var(--red)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;color:var(--text);padding:6px 10px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}

.hero{padding:64px 0 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center}.hero .cta{justify-content:center}}
h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:0 0 16px;color:var(--navy)}
h1 span{color:var(--red)}
.hero>div:first-child{text-align:center}.hero p{color:var(--muted);font-size:18px;max-width:520px;margin:0 auto 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:12px 24px;border-radius:4px;font-weight:700;border:2px solid var(--red);background:var(--red);color:#fff;cursor:pointer;font-size:16px}
.btn.alt{background:none;color:var(--navy);border-color:var(--navy)}
.logo{display:flex;justify-content:center}
.logo svg{width:min(380px,85%);height:auto}
.bar{background:var(--bar);color:#fff}

.bar i{color:#fff;opacity:.6;font-style:normal}
section{padding:64px 0}
h2{font-size:30px;font-weight:800;margin:0 0 8px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;border-top:4px solid var(--red)}
.card h3{margin:0 0 6px;font-size:18px;color:var(--navy)}
.card p{margin:0;color:var(--muted);font-size:15px}
.ico{font-size:28px;margin-bottom:8px}
.why{background:var(--card);border-block:1px solid var(--line)}
.why .card{border-top-color:var(--navy)}
#contact{text-align:center}#contact .sub{margin-left:auto;margin-right:auto}form{display:grid;gap:12px;max-width:560px;margin:0 auto}
input,textarea{width:100%;padding:12px;border:1px solid #cfc9c0;border-radius:4px;background:var(--card);color:var(--text);font:inherit}
.info{display:grid;gap:10px;margin:0 auto 24px;justify-items:center;color:var(--muted)}
.info b{color:var(--navy)}.info a{font-weight:600;color:var(--text)}.info a:hover{color:var(--red)}
.wa{margin:0 auto 32px}.wa h3{color:var(--navy);font-size:20px;margin:0 0 12px}.wa img{display:block;margin:0 auto 14px;border-radius:4px;background:#fff;padding:8px;border:1px solid var(--line);max-width:100%;height:auto}.wab{background:#25d366;border-color:#25d366;color:#0b3d1e}
.narrow{max-width:760px}

.svc li{display:grid;grid-template-columns:230px 1fr;gap:8px 24px;padding:18px 0;border-bottom:1px solid var(--line)}
.svc h3{margin:0;font-size:19px;color:var(--navy)}.svc p{margin:0;color:var(--muted)}

.eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#c1222c;margin-bottom:14px}
.btn{transition:background .2s,color .2s,border-color .2s}.btn:hover{background:var(--navy);border-color:var(--navy);color:#fff}

.svc li:nth-child(2){transition-delay:.08s}.svc li:nth-child(3){transition-delay:.16s}.svc li:nth-child(4){transition-delay:.24s}.svc li:nth-child(5){transition-delay:.32s}

.cflex{align-items:stretch;gap:28px;margin-top:16px}

.ccard.wa{align-items:center;text-align:center;margin:0}.ccard.wa h3{margin:0 0 16px}.ccard.wa img{margin-bottom:18px}

.cico{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;transition:background .2s}
.crow small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.crow:hover{color:var(--red)}.crow:hover .cico{background:var(--red)}
